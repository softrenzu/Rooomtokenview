name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser tests
        run: npm test
